name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: pwsh
        run: |
          $dest = "dist/openab-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/openab.exe" "$dest/openab.exe"
          Copy-Item "config.toml.example" "$dest/config.toml.example"
          Copy-Item "README.md" "$dest/README.md"
          Copy-Item "LICENSE" "$dest/LICENSE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openab-${{ matrix.target }}
          path: dist/openab-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

      - name: Attach binary to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/openab-${{ matrix.target }}/*" `
            -DestinationPath "openab-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: openab-${{ github.ref_name }}-${{ matrix.target }}.zip
